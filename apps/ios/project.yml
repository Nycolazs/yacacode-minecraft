name: YacaCodeMC
options:
  bundleIdPrefix: com.yacacode
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: F57SJFTGUK
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  YacaCodeMC:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: YacaCodeMC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yacacode.minecraft
        PRODUCT_NAME: YacaCodeMC
        INFOPLIST_KEY_CFBundleDisplayName: "YacaCode MC"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: YacaCodeMC/Resources/Info.plist
      properties:
        CFBundleDisplayName: "YacaCode MC"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSFaceIDUsageDescription: "Use o Face ID ou Touch ID para entrar rapidamente com segurança no Painel YacaCode Minecraft."
        NSLocalNetworkUsageDescription: "Permite conectar ao servidor Orange Pi na rede local ou via Tailscale."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  YacaCodeMCTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: YacaCodeMCTests
    dependencies:
      - target: YacaCodeMC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yacacode.minecraft.tests
        GENERATE_INFOPLIST_FILE: YES
